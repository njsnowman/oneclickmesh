name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: Apple-Silicon-arm64
          - runner: macos-15-intel
            arch: Intel-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out One Click Mesh
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build requirements
        run: python -m pip install -r requirements-build.txt

      - name: Fetch NTIA ITM v1.4 source
        run: git clone --depth 1 --branch v1.4 https://github.com/NTIA/itm.git "$RUNNER_TEMP/itm"

      - name: Build the native ITM library
        run: bash scripts/build-itm-macos.sh "$RUNNER_TEMP/itm"

      - name: Package the macOS app
        run: python -m PyInstaller --noconfirm --clean packaging/one-click-mesh.spec

      - name: Archive the app
        run: ditto -c -k --sequesterRsrc --keepParent dist/One-Click-Mesh.app "dist/One-Click-Mesh-macOS-${{ matrix.arch }}.zip"

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: One-Click-Mesh-macOS-${{ matrix.arch }}
          path: dist/One-Click-Mesh-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30
